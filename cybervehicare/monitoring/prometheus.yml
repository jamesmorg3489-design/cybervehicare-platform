global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prediction-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["prediction:8000"]

  - job_name: "telemetry-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["telemetry:8001"]

  - job_name: "diagnostics-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["diagnostics:8002"]

  - job_name: "alert-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["alert:8003"]
