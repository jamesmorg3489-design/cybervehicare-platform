global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8000']

  - job_name: 'telemetry'
    static_configs:
      - targets: ['telemetry:8001']

  - job_name: 'diagnostics'
    static_configs:
      - targets: ['diagnostics:8002']

  - job_name: 'prediction'
    static_configs:
      - targets: ['prediction:8003']

  - job_name: 'alert'
    static_configs:
      - targets: ['alert:8004']

  - job_name: 'monolith'
    static_configs:
      - targets: ['monolith:9000']
