# =============================================================
# Cybervehicare — Vehicle Health Monitoring Framework
# Phase 7: Docker Compose
# =============================================================
# Usage:
#   docker compose up --build          # build + start all services
#   docker compose up --build -d       # detached mode
#   docker compose down                # stop + remove containers
#   docker compose logs -f telemetry   # follow a single service log
# =============================================================

version: "3.9"

# ── Shared build context ──────────────────────────────────────
x-base: &base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  volumes:
    # Mount the full repo so ml/models/ and data/processed/ are accessible
    # at the same relative paths the application code already expects.
    - .:/app

# ─────────────────────────────────────────────────────────────
services:

  # ── 1. Prediction API ──────────────────────────────────────
  prediction:
    <<: *base
    container_name: cybervehicare_prediction
    command: >
      python3 -m uvicorn ml.serve_model:app
      --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 2. Diagnostics Service ─────────────────────────────────
  diagnostics:
    <<: *base
    container_name: cybervehicare_diagnostics
    command: >
      python3 -m uvicorn services.diagnostics.main:app
      --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 3. Alert Service ───────────────────────────────────────
  alert:
    <<: *base
    container_name: cybervehicare_alert
    command: >
      python3 -m uvicorn services.alert.main:app
      --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 4. Telemetry Service ───────────────────────────────────
  telemetry:
    <<: *base
    container_name: cybervehicare_telemetry
    command: >
      python3 -m uvicorn services.telemetry.main:app
      --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      # Docker service-name URLs override the localhost defaults
      - PREDICTION_URL=http://prediction:8000/predict
      - DIAGNOSTICS_URL=http://diagnostics:8002/diagnostics/evaluate
      - ALERT_URL=http://alert:8003/alerts/create
    depends_on:
      prediction:
        condition: service_healthy
      diagnostics:
        condition: service_healthy
      alert:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 5. Streamlit Dashboard ─────────────────────────────────
  dashboard:
    <<: *base
    container_name: cybervehicare_dashboard
    command: >
      streamlit run services/dashboard/app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      # Dashboard uses these to reach backend services inside Docker
      - PREDICTION_API_URL=http://prediction:8000
      - TELEMETRY_API_URL=http://telemetry:8001
      - DIAGNOSTICS_API_URL=http://diagnostics:8002
      - ALERT_API_URL=http://alert:8003
    depends_on:
      prediction:
        condition: service_healthy
      telemetry:
        condition: service_healthy
      diagnostics:
        condition: service_healthy
      alert:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    container_name: cybervehicare_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      prediction:
        condition: service_healthy
      telemetry:
        condition: service_healthy
      diagnostics:
        condition: service_healthy
      alert:
        condition: service_healthy

